<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hey Pumpkin 💖</title>

    <link rel="stylesheet" href="style2.css" />

    <meta name="description" content="A little Valentine surprise made with love." />
    <meta name="keywords" content="Valentine, Love, Pumpkin, Surprise" />
    <meta name="author" content="Your Wife ❤️" />

    <meta property="og:title" content="Hey Pumpkin 💖" />
    <meta
      property="og:description"
      content="There is a small question waiting for you… 👀💕"
    />
    <meta
      property="og:image"
      content="https://i.ibb.co/k6xD4nM/New-Project.jpg"
    />
    <meta property="og:type" content="website" />
  </head>

  <body>
    <!-- TOP CREDIT -->
    <div class="flex f-aps">
      <p>
        Made with ❤️ by your wife
      </p>
      <img
        class="image2"
        src="https://logodix.com/logo/1205168.png"
        alt="heart"
        id="heart1"
      />
    </div>

    <!-- MAIN QUESTION -->
    <h1 class="headerText" id="wedate">
      Hey pumpkin 🎃💖<br />
      Will you be my Valentine?
    </h1>

    <!-- MAIN GIF -->
    <img
      class="image"
      src="https://github.com/NikhilMarko03/resources/blob/main/happy1.gif?raw=true"
      alt="cute"
      id="mainImg"
    />

    <!-- YES / NO BUTTONS -->
    <div class="flex" id="btns">
      <button
        class="button"
        id="yes"
        onmouseenter="happy()"
        onmouseleave="normal()"
        onclick="yes()"
      >
        Yes 💕
      </button>

      <button
        class="button"
        id="no"
        onmouseenter="angry()"
        onmouseleave="normal()"
        onclick="no()"
      >
        No 😏
      </button>
    </div>

    <!-- FLOATING HEARTS -->
    <div class="absImages" id="absImg">
      <img class="image1" src="https://github.com/NikhilMarko03/resources/blob/main/heart.gif?raw=true" />
      <img class="image1" src="https://github.com/NikhilMarko03/resources/blob/main/heart.gif?raw=true" />
      <img class="image1" src="https://github.com/NikhilMarko03/resources/blob/main/heart.gif?raw=true" />
      <img class="image1" src="https://github.com/NikhilMarko03/resources/blob/main/heart.gif?raw=true" />
      <img class="image1" src="https://github.com/NikhilMarko03/resources/blob/main/heart.gif?raw=true" />
    </div>

    <!-- YES CLICK MODAL -->
    <div class="model" id="model2">
      <audio id="happyMusic" style="opacity: 0" controls loop>
        <source src="./resources/happy.mp3" type="audio/mp3" />
      </audio>

      <div class="model-content">
        <p class="modelText" id="modelText2">
          Yayyy ❤️<br /><br />
          You are my Valentine today,<br />
          tomorrow and forever 💕<br /><br />
          I love you so much, pumpkin 😘
        </p>

        <img
          class="modelImg"
          id="modelImg2"
          src="https://takelessons.com/blog/wp-content/uploads/2013/07/happy-cat.gif"
          alt="happy"
        />

        <button
          class="button"
          onmouseenter="happy()"
          onmouseleave="normal()"
          onclick="ly2()"
        >
          Love You Too 🥰
        </button>
      </div>
    </div>

    <!-- NO CLICK MODAL -->
    <div id="model" class="model">
      <audio id="sadMusic" style="opacity: 0" controls loop>
        <source src="./resources/sad.mp3" type="audio/mp3" />
      </audio>

      <div class="model-content">
        <p class="modelText" id="modelText">
          Are you sure? 🥺💔
        </p>

        <img
          class="modelImg"
          id="modelImg"
          src="https://media1.tenor.com/images/9413ffc5a11722a3cc456a88810750bd/tenor.gif"
          alt="sad"
        />

        <div class="flex">
          <button
            class="button"
            onmouseenter="happy()"
            onmouseleave="normal()"
            onclick="yes()"
          >
            Okay Yes 💕
          </button>

          <button
            class="button"
            onmouseenter="angry()"
            onmouseleave="normal()"
            onclick="no()"
          >
            Still No 😭
          </button>
        </div>
      </div>
    </div>

    <script src="main2.js"></script>
  </body>
</html>
